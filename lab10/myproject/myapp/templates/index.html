<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<title>Person Table</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

.btn-edit{
background:#ff69b4;
color:white;
}

.btn-delete{
background:orange;
color:white;
}

.center-btn{
text-align:center;
}

</style>

</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="text-center mb-4">ตารางข้อมูล Person</h2>

<table class="table table-bordered table-hover text-center">

<thead class="table-dark">

<tr>
<th>ID</th>
<th>ชื่อ</th>
<th>อายุ</th>
<th>วันที่</th>
<th>จัดการข้อมูล</th>
</tr>

</thead>

<tbody>

{% for p in persons %}

<tr>

<td>{{ p.id }}</td>
<td>{{ p.name }}</td>
<td>{{ p.age }}</td>
<td>{{ p.date }}</td>

<td class="center-btn">

<button class="btn btn-edit">Edit</button>

<button class="btn btn-delete">Delete</button>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>
</html>
