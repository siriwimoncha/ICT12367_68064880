<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Form - Read Only Mode</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(to right, #ffe4ec, #fff0f5); }
        .navbar { background-color: #ff69b4 !important; }
        .navbar-brand, .nav-link { color: white !important; font-weight: bold; }
        .card { border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,0.1); }
        .btn-pink { background:#ff69b4; color:white; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">🎀 My Database</a>
    </div>
</nav>

<div class="container">
    <div class="card p-4 mx-auto" style="max-width: 500px;">
        <h3 class="text-center text-danger mb-4">💗 ข้อมูลสมาชิก 💗</h3>

        <form>
            <div class="mb-3">
                <label>ชื่อ</label>
                <input type="text" class="form-control" value="{{ person.firstname }}" readonly>
            </div>
            <div class="mb-3">
                <label>นามสกุล</label>
                <input type="text" class="form-control" value="{{ person.lastname }}" readonly>
            </div>
            <div class="mb-3">
                <label>ชื่อเล่น</label>
                <input type="text" class="form-control" value="{{ person.nickname }}" readonly>
            </div>
            <div class="mb-3">
                <label>อายุ</label>
                <input type="number" class="form-control" value="{{ person.age }}" readonly>
            </div>
            
            <button type="button" class="btn btn-secondary w-100" disabled>ปิดปรับปรุงการบันทึก</button>
        </form>
        <br>
        <a href="/" class="btn btn-outline-secondary w-100">⬅ กลับหน้าหลัก</a>
    </div>
</div>

</body>
</html>
