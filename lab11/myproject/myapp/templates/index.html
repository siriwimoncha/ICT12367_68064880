<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Person Table - Read Only</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(to right, #ffe4ec, #fff0f5); }
        .navbar { background-color: #ff69b4 !important; }
        .navbar-brand, .nav-link { color: white !important; font-weight: bold; }
        .title { color:#ff4d88; font-weight:bold; }
        .card { border-radius:15px; box-shadow:0 5px 15px rgba(0,0,0,0.1); }
        /* สไตล์สำหรับปุ่มที่กดไม่ได้ */
        .btn-disabled { background: #ccc; color: white; cursor: not-allowed; pointer-events: none; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">🎀 My Database</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/">หน้าหลัก</a>
            <a class="nav-link" href="/form/">เพิ่มข้อมูล</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card p-4">
        <h2 class="text-center title mb-4">🍯⊹🐻* ตารางข้อมูล Person (View Only) ₊˚🍪⤾·</h2>

        <table class="table table-bordered text-center">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>ชื่อ-นามสกุล</th>
                    <th>ชื่อเล่น</th>
                    <th>อายุ</th>
                    <th>จัดการ</th>
                </tr>
            </thead>
            <tbody>
                {% for p in persons %}
                <tr>
                    <td>{{ p.id }}</td>
                    <td>{{ p.firstname }} {{ p.lastname }}</td>
                    <td>{{ p.nickname }}</td>
                    <td>{{ p.age }}</td>
                    <td>
                        <span class="badge bg-secondary">แก้ไขไม่ได้</span>
                        <span class="badge bg-secondary">ลบไม่ได้</span>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
