<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Form</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background: linear-gradient(to right, #ffe4ec, #fff0f5);
}

.card{
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.btn-pink{
    background:#ff69b4;
    color:white;
}
</style>
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark sticky-top" style="background-color: #ff69b4; border-bottom: 4px solid #ff4d94;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">🌸 YOGURT</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">หน้าหลัก</a></li>
                <li class="nav-item"><a class="nav-link" href="/form/">เพิ่มข้อมูล</a></li>
                <li class="nav-item"><a class="nav-link" href="/about/">เกี่ยวกับเรา</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="py-5 mb-4 text-center" style="background: linear-gradient(rgba(255,105,180,0.8), rgba(255,182,193,0.8)), url('https://img.freepik.com/free-vector/cute-pattern-background-pink-aesthetic-vector-cloud-design_53876-146317.jpg'); background-size: cover; background-position: center; color: white;">
    <div class="container">
        <h1 class="display-4 fw-bold">ยินดีต้อนรับสู่ระบบจัดการข้อมูล 🍯</h1>
        <p class="lead">รายวิชา ICT12367</p>
    </div>
</div>

<div class="container mt-5">
<div class="card p-4">

<h3 class="text-center text-danger mb-4">💗 เพิ่ม / แก้ไขข้อมูล 💗</h3>

<form method="POST">
    {% csrf_token %}

    <div class="mb-3">
        <label>ชื่อ</label>
        <input type="text" name="firstname" class="form-control" value="{{ person.firstname }}">
    </div>

    <div class="mb-3">
        <label>นามสกุล</label>
        <input type="text" name="lastname" class="form-control" value="{{ person.lastname }}">
    </div>

    <div class="mb-3">
        <label>ชื่อเล่น</label>
        <input type="text" name="nickname" class="form-control" value="{{ person.nickname }}">
    </div>

    <div class="mb-3">
        <label>อายุ</label> <!-- 👈 เพิ่ม -->
        <input type="number" name="age" class="form-control" value="{{ person.age }}">
    </div>

    <button type="submit" class="btn btn-pink w-100">บันทึก</button>
</form>
<br>
<a href="/" class="btn btn-secondary w-100">⬅ กลับหน้าหลัก</a>

</div>
</div>

</body>
</html>
